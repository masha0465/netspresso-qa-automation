# Alternative MockAdapter scenario set used to simulate a "current" run that
# regressed relative to the baseline scenario set (configs/mock_scenarios.yaml).
#
# Differences vs baseline:
#   SCN-R01  mobilenet_v2 / intel_xeon / onnxruntime / default / int8_quantization
#            -> latency now 1.22x (was ~0.47x): PERFORMANCE regression
#   SCN-R02  yolov8n / intel_xeon / onnxruntime / default / fp16_conversion
#            -> accuracy drop 1.9 pp (was ~0.1 pp): ACCURACY regression
#   SCN-R03  mobilenet_v2 / raspberry_pi_4b / tflite / default / fp16_conversion
#            -> reproducibility degraded to NOT_REPRODUCIBLE
#   SCN-001 (baseline accuracy regression) is intentionally kept so the
#            comparison shows an unchanged FAIL (not a new regression).
#   SCN-002 removed -> that case now PASSES (improvement, not a regression).

optimization_profiles:
  fp16_conversion:
    accuracy_delta_pp: -0.10
    latency_factor: 0.68
    memory_factor: 0.80
    size_factor: 0.52
  int8_quantization:
    accuracy_delta_pp: -0.60
    latency_factor: 0.47
    memory_factor: 0.62
    size_factor: 0.27
  automatic_compression:
    accuracy_delta_pp: -0.45
    latency_factor: 0.71
    memory_factor: 0.74
    size_factor: 0.55

scenarios:
  - id: SCN-R01
    match: { model: mobilenet_v2, device: intel_xeon_w2233, runtime: onnxruntime, backend: default, optimization: int8_quantization }
    outcome: COMPLETED
    metric_overrides: { latency_factor: 1.22 }
    note: "Regressed run: INT8 latency now slower than FP32 baseline (mock)"

  - id: SCN-R02
    match: { model: yolov8n, device: intel_xeon_w2233, runtime: onnxruntime, backend: default, optimization: fp16_conversion }
    outcome: COMPLETED
    metric_overrides: { accuracy_delta_pp: -1.90 }
    note: "Regressed run: FP16 accuracy drop grew from 0.1 pp to 1.9 pp (mock)"

  - id: SCN-R03
    match: { model: mobilenet_v2, device: raspberry_pi_4b, runtime: tflite, backend: default, optimization: fp16_conversion }
    outcome: COMPLETED
    reproducibility: NOT_REPRODUCIBLE
    note: "Regressed run: outputs no longer reproducible (mock)"

  - id: SCN-001
    match: { model: yolov8n, device: raspberry_pi_4b, runtime: tflite, backend: xnnpack, optimization: int8_quantization }
    outcome: COMPLETED
    metric_overrides: { accuracy_delta_pp: -3.20 }
    note: "Unchanged from baseline: known INT8 accuracy regression (mock)"

  - id: SCN-003
    match: { model: mobilenet_v2, device: intel_xeon_w2233, runtime: onnxruntime, backend: openvino_ep, optimization: int8_quantization }
    outcome: COMPLETED
    artifact_checksum_valid: false

  - id: SCN-004
    match: { model: mobilenet_v2, device: jetson_orin_nano, runtime: tensorrt, backend: default, optimization: int8_quantization }
    outcome: COMPLETED
    reproducibility: NOT_REPRODUCIBLE

  - id: SCN-005
    match: { model: pidnet_s, device: raspberry_pi_4b, runtime: tflite, backend: "*", optimization: fp16_conversion }
    outcome: ERROR
    error_kind: CONVERSION_FAILURE
    message: "Unsupported operator 'GridSample' during TFLite conversion (mock)"

  - id: SCN-006
    match: { model: pidnet_s, device: "*", runtime: openvino, backend: "*", optimization: automatic_compression }
    outcome: ERROR
    error_kind: MODEL_COMPATIBILITY_ERROR
    message: "Model contains dynamic input shape not supported by compression service (mock)"

  - id: SCN-007
    match: { model: yolov8n, device: jetson_orin_nano, runtime: onnxruntime, backend: default, optimization: automatic_compression }
    outcome: ERROR
    error_kind: null
    message: "Task ended with status ERROR and empty error_log (mock)"

  - id: SCN-008
    match: { model: "*", device: jetson_orin_nano, runtime: tensorrt, backend: default, optimization: automatic_compression }
    outcome: BLOCKED
    error_kind: ENVIRONMENT_ERROR
    message: "Target device farm slot unavailable; execution not attempted (mock)"

  - id: SCN-009
    match: { model: "*", device: intel_xeon_w2233, runtime: tflite, backend: xnnpack, optimization: automatic_compression }
    outcome: UNSUPPORTED
    message: "Service reported: compression output not deployable to TFLite/XNNPACK on this target (mock)"
