# Model dimension of the test matrix.
#
# NOTE: `mock_baseline` values are synthetic numbers used ONLY by MockAdapter to
# produce deterministic results. They are NOT measured accuracies of the real
# models and must never be presented as such.
#
# risk flags feed the risk-based selector (see configs/risk.yaml).
models:
  - name: yolov8n
    task: object_detection
    framework: onnx
    input_shape: [1, 3, 640, 640]
    accuracy_metric: mAP50-95        # primary detection metric (COCO-style); mAP50/mAP75/P/R are secondary
    source: "public ModelZoo-YOLOv8 (Nota-NetsPresso GitHub)"
    risk:
      new_model: false
      previous_regression: true       # scenario: a prior INT8 accuracy regression is on record (mock)
      customer_facing: true
    mock_baseline:
      accuracy: 0.520
      latency_ms: 42.0
      memory_mb: 96.0
      model_size_mb: 12.4

  - name: mobilenet_v2
    task: image_classification
    framework: onnx
    input_shape: [1, 3, 224, 224]
    accuracy_metric: top1
    source: "public torchvision / ONNX model zoo"
    risk:
      new_model: false
      previous_regression: false
      customer_facing: true
    mock_baseline:
      accuracy: 0.718
      latency_ms: 9.5
      memory_mb: 38.0
      model_size_mb: 13.6

  - name: pidnet_s
    task: semantic_segmentation
    framework: onnx
    input_shape: [1, 3, 512, 1024]
    accuracy_metric: mIoU
    source: "public ModelZoo-PIDNet (Nota-NetsPresso GitHub)"
    risk:
      new_model: true                 # newly added to the matrix -> higher risk
      previous_regression: false
      customer_facing: false
    mock_baseline:
      accuracy: 0.786
      latency_ms: 118.0
      memory_mb: 210.0
      model_size_mb: 30.1
